name: Executar Monitoramento PNCP

on:
  schedule:
    - cron: "0 9,15 * * 1-5" # 06h e 12h, hor�rio de Bras�lia
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ingest.py
      - cotacao.py
      - app.py
      - requirements.txt
      - .github/workflows/rotina_pncp.yml

permissions:
  contents: read

concurrency:
  group: monitoramento-pncp
  cancel-in-progress: false

jobs:
  executar-busca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar c�digo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar depend�ncias
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validar sintaxe
        run: python -m compileall -q ingest.py cotacao.py app.py

      - name: Executar ingest�o de dados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PNCP_UF: RJ
          PNCP_MODALIDADES: "4,6,7,8,12"
          PNCP_LOOKBACK_DAYS: "15"
          PNCP_MAX_PAGES_PER_MODALITY: "100"
        run: python ingest.py

